name: Build and Publish NPM Package

on:
  workflow_call:
    inputs:
      packagePath:
        required: true
        type: string
      packageName:
        required: true
        type: string

env:
  NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}

jobs:
  publish-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.packagePath }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com/
          scope: "@burtsonlabs"

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
