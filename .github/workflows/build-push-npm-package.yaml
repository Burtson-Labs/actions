name: Build and Publish NPM Package

on:
  workflow_call:
    inputs:
      packagePath:
        required: true
        type: string
      packageName:
        required: true
        type: string
      publishToRegistry:
        required: false
        type: boolean
        default: false
      registryUrl:
        required: false
        type: string
        default: "https://registry.npmjs.org/"
      isPublic:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  publish-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.packagePath }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com/
          scope: "@burtson-labs"

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
          IS_PUBLIC: ${{ inputs.isPublic }}
        run: |
          if [ "${IS_PUBLIC}" = "true" ]; then
            npm publish --access public || echo "Package version already exists in GitHub Packages, skipping..."
          else
            npm publish || echo "Package version already exists in GitHub Packages, skipping..."
          fi

      - name: Publish to npmjs registry
        if: inputs.publishToRegistry
        env:
          REGISTRY_URL: ${{ inputs.registryUrl }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.packageName }}
          IS_PUBLIC: ${{ inputs.isPublic }}
        run: |
          if [ -z "$REGISTRY_URL" ]; then
            REGISTRY_URL="https://registry.npmjs.org/"
            echo "registryUrl input empty; defaulting to $REGISTRY_URL"
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret must be provided when publishToRegistry is true" >&2
            exit 1
          fi
          
          # Clear any existing npm configuration using --location=user
          npm config delete registry --location=user || true
          npm config delete always-auth --location=user || true
          npm config delete @burtson-labs:registry --location=user || true
          
          # Set up fresh configuration for npmjs
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          export NPM_CONFIG_REGISTRY="$REGISTRY_URL"
          REGISTRY_HOST=$(echo "$REGISTRY_URL" | sed -e 's#^https\?://##' -e 's#/$##')
          npm config set registry "$REGISTRY_URL" --location=user
          npm config set "//${REGISTRY_HOST}/:_authToken" "$NPM_TOKEN" --location=user
          npm config set always-auth true --location=user
          
          if [[ $PACKAGE_NAME == @*/* ]]; then
            SCOPE=${PACKAGE_NAME%%/*}
            npm config set "${SCOPE}:registry" "$REGISTRY_URL" --location=user
          fi
          
          echo "Publishing $PACKAGE_NAME to $REGISTRY_URL"
          if [ "${IS_PUBLIC}" = "true" ]; then
            npm publish --registry "$REGISTRY_URL" --access public
          else
            npm publish --registry "$REGISTRY_URL"
          fi
