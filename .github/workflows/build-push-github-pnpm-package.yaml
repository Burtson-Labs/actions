name: Build and Publish PNPM Package to GitHub Packages

on:
  workflow_call:
    inputs:
      packagePath:
        required: true
        type: string
      packageName:
        required: true
        type: string
      isPublic:
        required: false
        type: boolean
        default: false
      pnpmVersion:
        required: false
        type: string
        default: "9.0.0"
      registryUrl:
        required: false
        type: string
        default: "https://npm.pkg.github.com/"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'JSON-encoded runs-on value. Default is "ubuntu-latest". Pass "burtson-labs-runners" (the scale-set name) to opt into the Burtson-Labs self-hosted K3s pool.'

jobs:
  publish-package:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable Corepack (pnpm)
        env:
          PNPM_VERSION: ${{ inputs.pnpmVersion }}
        run: |
          VERSION="${PNPM_VERSION:-9.0.0}"
          echo "Activating pnpm@$VERSION"
          corepack enable
          corepack prepare "pnpm@$VERSION" --activate

      - name: Verify package path
        run: |
          if [ ! -f "${{ inputs.packagePath }}/package.json" ]; then
            echo "package.json not found at ${{ inputs.packagePath }}" >&2
            exit 1
          fi

      - name: Prepare GitHub Packages auth
        id: github_auth
        env:
          REGISTRY_URL_INPUT: ${{ inputs.registryUrl }}
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "GHCR_PAT secret must be provided" >&2
            exit 1
          fi
          REGISTRY_URL="$REGISTRY_URL_INPUT"
          if [ -z "$REGISTRY_URL" ]; then
            REGISTRY_URL="https://npm.pkg.github.com/"
          fi
          TEMP_NPMRC=$(mktemp)
          REGISTRY_HOST=$(echo "$REGISTRY_URL" | sed -e 's#^https\?://##' -e 's#/$##')
          {
            echo "registry=$REGISTRY_URL"
            echo "//${REGISTRY_HOST}/:_authToken=$NODE_AUTH_TOKEN"
            echo "always-auth=true"
          } > "$TEMP_NPMRC"
          echo "npmrc_path=$TEMP_NPMRC" >> "$GITHUB_OUTPUT"
          echo "registry_url=$REGISTRY_URL" >> "$GITHUB_OUTPUT"

      - name: Install dependencies with pnpm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml not found; falling back to plain install."
            pnpm install
          fi

      - name: Build package
        env:
          PACKAGE_NAME: ${{ inputs.packageName }}
        run: |
          if [ -z "$PACKAGE_NAME" ]; then
            echo "packageName input is required" >&2
            exit 1
          fi
          pnpm --filter "$PACKAGE_NAME" run build

      - name: Publish to GitHub Packages
        env:
          PACKAGE_NAME: ${{ inputs.packageName }}
          IS_PUBLIC: ${{ inputs.isPublic }}
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
          NPM_CONFIG_USERCONFIG: ${{ steps.github_auth.outputs.npmrc_path }}
          REGISTRY_URL: ${{ steps.github_auth.outputs.registry_url }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "GHCR_PAT secret must be provided" >&2
            exit 1
          fi
          if [ -z "$PACKAGE_NAME" ]; then
            echo "packageName input is required" >&2
            exit 1
          fi
          if [ "${IS_PUBLIC}" = "true" ]; then
            pnpm --filter "$PACKAGE_NAME" publish --no-git-checks --access public --registry "$REGISTRY_URL" || echo "Package version already exists in GitHub Packages, skipping..."
          else
            pnpm --filter "$PACKAGE_NAME" publish --no-git-checks --registry "$REGISTRY_URL" || echo "Package version already exists in GitHub Packages, skipping..."
          fi

      - name: Clean up npm auth config
        if: ${{ steps.github_auth.outputs.npmrc_path != '' }}
        run: rm -f "${{ steps.github_auth.outputs.npmrc_path }}"
