name: build-push-ng-lib

on: 
  workflow_call:
    inputs:
      lib-name:
        description: 'Optional input to specify the lib name for publishing (this should be the unscoped dir name)'
        required: false
        default: $(echo ${{ github.repository }} | cut -d'/' -f2)
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '20.x'
        type: string
      build-command:
        description: 'The command to build the project'
        required: false
        default: 'npm run build'
        type: string
      runs_on:
        description: 'JSON-encoded runs-on value. Default is "ubuntu-latest". Pass "burtson-labs-runners" (the scale-set name) to opt into the Burtson-Labs self-hosted K3s pool.'
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      MY_GITHUB_TOKEN:
        required: true
jobs:
  build-push-ng-lib:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    
    steps:
      - name: Checkout "${{ github.repository }}"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        
      - name: Add github package auth
        run: | 
          echo "@burtson-labs:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.MY_GITHUB_TOKEN }}" >> ~/.npmrc
      
      - name: Setup node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      
      - name: Install Packages
        run: npm ci

      - name: Build 
        run: ${{ inputs.build-command }}

      - name: Publish to github packages
        run: npm publish ./dist/${{inputs.lib-name}}

      

      

      
      

      
      