name: Build and Publish NPM Package to npmjs

on:
  workflow_call:
    inputs:
      packagePath:
        required: true
        type: string
      packageName:
        required: true
        type: string
      registryUrl:
        required: false
        type: string
        default: "https://registry.npmjs.org/"
      isPublic:
        required: false
        type: boolean
        default: false
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'JSON-encoded runs-on value. Default is "ubuntu-latest". Pass "burtson-labs-runners" (the scale-set name) to opt into the Burtson-Labs self-hosted K3s pool.'
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish-package:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    defaults:
      run:
        working-directory: ${{ inputs.packagePath }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: ${{ inputs.registryUrl }}

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to npmjs registry
        env:
          REGISTRY_URL: ${{ inputs.registryUrl }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.packageName }}
          IS_PUBLIC: ${{ inputs.isPublic }}
        run: |
          if [ -z "$REGISTRY_URL" ]; then
            REGISTRY_URL="https://registry.npmjs.org/"
            echo "registryUrl input empty; defaulting to $REGISTRY_URL"
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret must be provided" >&2
            exit 1
          fi
          
          # Create a temporary .npmrc file for this publish operation
          TEMP_NPMRC=$(mktemp)
          REGISTRY_HOST=$(echo "$REGISTRY_URL" | sed -e 's#^https\?://##' -e 's#/$##')
          
          echo "registry=$REGISTRY_URL" > "$TEMP_NPMRC"
          echo "//${REGISTRY_HOST}/:_authToken=$NPM_TOKEN" >> "$TEMP_NPMRC"
          echo "always-auth=true" >> "$TEMP_NPMRC"
          
          if [[ $PACKAGE_NAME == @*/* ]]; then
            SCOPE=${PACKAGE_NAME%%/*}
            echo "${SCOPE}:registry=$REGISTRY_URL" >> "$TEMP_NPMRC"
          fi
          
          echo "Publishing $PACKAGE_NAME to $REGISTRY_URL"
          echo "Using temporary npmrc: $TEMP_NPMRC"
          cat "$TEMP_NPMRC"

          # Idempotency guard: skip if this exact version is already on the
          # registry. Reusable publish jobs run on any monorepo push, so a push
          # that bumped one package shouldn't 403 trying to re-publish an
          # unchanged sibling at the same version. Read the real name+version
          # from package.json (PACKAGE_NAME may be unscoped).
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Checking if ${PKG_NAME}@${PKG_VERSION} is already published…"
          EXISTING=$(npm view "${PKG_NAME}@${PKG_VERSION}" version --userconfig "$TEMP_NPMRC" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
            rm -f "$TEMP_NPMRC"
            exit 0
          fi

          if [ "${IS_PUBLIC}" = "true" ]; then
            npm publish --userconfig "$TEMP_NPMRC" --access public
          else
            npm publish --userconfig "$TEMP_NPMRC"
          fi
          
          # Clean up temporary file
          rm -f "$TEMP_NPMRC"