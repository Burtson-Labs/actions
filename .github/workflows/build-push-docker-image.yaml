name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "linux/arm64"
        description: "Target platforms for multi-platform builds (e.g., linux/amd64,linux/arm64)"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'JSON-encoded runs-on value. Default is "ubuntu-latest". Pass "burtson-labs-runners" (the scale-set name) to opt into the Burtson-Labs self-hosted K3s pool.'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.imageName }}

jobs:
  docker-publish:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Auth to GHCR FIRST so the QEMU step (which pulls a binfmt image)
      # can hit our mirrored GHCR copy instead of Docker Hub. Every Pi 5
      # runner pod NATs through one home IP; without this, we burn the
      # 100/6h Docker Hub anonymous limit very quickly.
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up QEMU
        # Skip when only building the host's native arch — saves a binfmt
        # pull and ~5s of setup. (For our self-hosted arm64 pool, callers
        # default to platforms=linux/arm64 and we're already on arm64.)
        if: ${{ contains(inputs.platforms, 'amd64') || contains(inputs.platforms, ',') }}
        uses: docker/setup-qemu-action@v3
        with:
          # Mirrored at ghcr.io/burtson-labs/binfmt by the
          # `mirror-images.yml` workflow in Burtson-Labs/ci-runners.
          # GHCR has no rate limit and we already auth'd above.
          image: ghcr.io/burtson-labs/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
      
      - name: Debug NPM_TOKEN
        run: echo "NPM_TOKEN=${{ secrets.GHCR_PAT }}"            

      - name: Debug image info
        run: |
          echo "ImageName: ${{ env.IMAGE_NAME }}"
          echo "Docker tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.GHCR_PAT }}
          secrets: |
            npmrc=${{ secrets.NPMRC }}