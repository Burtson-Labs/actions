name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "linux/arm64"
        description: "Target platforms for multi-platform builds (e.g., linux/amd64,linux/arm64)"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.imageName }}

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
      
      - name: Debug NPM_TOKEN
        run: echo "NPM_TOKEN=${{ secrets.GHCR_PAT }}"            

      - name: Debug image info
        run: |
          echo "ImageName: ${{ env.IMAGE_NAME }}"
          echo "Docker tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.GHCR_PAT }}
          secrets: |
            npmrc=${{ secrets.NPMRC }}