name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "linux/arm64"
        description: "Target platforms for multi-platform builds (e.g., linux/amd64,linux/arm64)"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'JSON-encoded runs-on value. Default is "ubuntu-latest". Pass "burtson-labs-runners" (the scale-set name) to opt into the Burtson-Labs self-hosted K3s pool.'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.imageName }}

jobs:
  docker-publish:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      # Auth to GHCR FIRST so the QEMU step (which pulls a binfmt image)
      # can hit our mirrored GHCR copy instead of Docker Hub. Every Pi 5
      # runner pod NATs through one home IP; without this, we burn the
      # 100/6h Docker Hub anonymous limit very quickly.
      - name: Log in to the Container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ${{ env.REGISTRY }}
          # Without the org GHCR_PAT, the caller's own GITHUB_TOKEN (needs
          # `packages: write`), which can only push packages linked to its repo.
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Set up QEMU
        # Skip when only building the host's native arch — saves a binfmt
        # pull and ~5s of setup. (For our self-hosted arm64 pool, callers
        # default to platforms=linux/arm64 and we're already on arm64.)
        if: ${{ contains(inputs.platforms, 'amd64') || contains(inputs.platforms, ',') }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          # Mirrored at ghcr.io/burtson-labs/binfmt by the
          # `mirror-images.yml` workflow in Burtson-Labs/ci-runners.
          # GHCR has no rate limit and we already auth'd above.
          image: ghcr.io/burtson-labs/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # buildx spawns its own buildkit daemon (docker-container driver)
          # that does NOT inherit dockerd's --registry-mirror config. We
          # configure buildkit explicitly here so all docker.io image
          # pulls during the build (FROM nginx, FROM node, etc.) go
          # through mirror.gcr.io — Google's free, unauthenticated
          # pull-through cache for Docker Hub. Otherwise our home IP
          # burns the 100/6h anonymous Docker Hub rate limit fast.
          config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242 # v3.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Same tags as the metadata-action defaults (branch / tag / pr-N),
          # plus :latest ONLY for default-branch builds. Every consumer chart
          # deploys image.tag=latest with pullPolicy Always, so a PR build
          # must never overwrite :latest.
          flavor: |
            latest=false
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Debug image info
        run: |
          echo "ImageName: ${{ env.IMAGE_NAME }}"
          echo "Docker tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.GHCR_PAT }}
          secrets: |
            npmrc=${{ secrets.NPMRC }}