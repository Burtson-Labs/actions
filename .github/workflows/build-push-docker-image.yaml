name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "linux/arm64"
        description: "Target platforms for multi-platform builds (e.g., linux/amd64,linux/arm64)"
      runs_on:
        required: false
        type: string
        default: '"ubuntu-latest"'
        description: 'JSON-encoded runs-on value. Default is "ubuntu-latest". Pass "burtson-labs-runners" (the scale-set name) to opt into the Burtson-Labs self-hosted K3s pool.'
      version:
        required: false
        type: string
        default: ""
        description: 'Immutable release tag to push as :<version> (default-branch builds only). Leave empty and set chart_path to use that chart''s appVersion.'
      chart_path:
        required: false
        type: string
        default: ""
        description: 'Chart directory whose Chart.yaml appVersion is the image version (used when version is empty). The chart should deploy image tag = appVersion with pullPolicy IfNotPresent.'
    outputs:
      version:
        description: 'The :<version> tag pushed ("" when none)'
        value: ${{ jobs.docker-publish.outputs.version }}
      sha_tag:
        description: 'The :sha-<short> tag pushed'
        value: ${{ jobs.docker-publish.outputs.sha_tag }}
      digest:
        description: 'Image digest (sha256:...)'
        value: ${{ jobs.docker-publish.outputs.digest }}
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.imageName }}

jobs:
  docker-publish:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.ver.outputs.version }}
      sha_tag: ${{ steps.ver.outputs.sha_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Every build pushes :sha-<short>. A default-branch build also pushes
      # :<version> (input, or the chart's appVersion) so charts can deploy an
      # immutable tag and `helm rollback` returns to an image that still exists.
      # GHCR keeps every version (no Burtson-Labs workflow deletes package
      # versions); keep it that way, or keep semver tags if a cleanup is added.
      - name: Resolve image version
        id: ver
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ -n "${{ inputs.chart_path }}" ]; then
            VERSION="$(grep -E '^appVersion:' "${{ inputs.chart_path }}/Chart.yaml" | head -1 | awk '{print $2}' | tr -d "\"'")"
            [ -n "$VERSION" ] || { echo "::error::No appVersion in ${{ inputs.chart_path }}/Chart.yaml"; exit 1; }
          fi
          case "$VERSION" in
            "") ;;
            latest|main) echo "::error::'$VERSION' is not an immutable version"; exit 1 ;;
            *[!A-Za-z0-9._-]*) echo "::error::Invalid version tag '$VERSION'"; exit 1 ;;
          esac
          if [ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            [ -z "$VERSION" ] || echo "Not the default branch: skipping the :$VERSION tag (sha tag only)."
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${VERSION:-<none>}, sha tag: sha-${GITHUB_SHA::7}"

      # Auth to GHCR FIRST so the QEMU step (which pulls a binfmt image)
      # can hit our mirrored GHCR copy instead of Docker Hub. Every Pi 5
      # runner pod NATs through one home IP; without this, we burn the
      # 100/6h Docker Hub anonymous limit very quickly.
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          # Without the org GHCR_PAT, the caller's own GITHUB_TOKEN (needs
          # `packages: write`), which can only push packages linked to its repo.
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Set up QEMU
        # Skip when only building the host's native arch — saves a binfmt
        # pull and ~5s of setup. (For our self-hosted arm64 pool, callers
        # default to platforms=linux/arm64 and we're already on arm64.)
        if: ${{ contains(inputs.platforms, 'amd64') || contains(inputs.platforms, ',') }}
        uses: docker/setup-qemu-action@v3
        with:
          # Mirrored at ghcr.io/burtson-labs/binfmt by the
          # `mirror-images.yml` workflow in Burtson-Labs/ci-runners.
          # GHCR has no rate limit and we already auth'd above.
          image: ghcr.io/burtson-labs/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildx spawns its own buildkit daemon (docker-container driver)
          # that does NOT inherit dockerd's --registry-mirror config. We
          # configure buildkit explicitly here so all docker.io image
          # pulls during the build (FROM nginx, FROM node, etc.) go
          # through mirror.gcr.io — Google's free, unauthenticated
          # pull-through cache for Docker Hub. Otherwise our home IP
          # burns the 100/6h anonymous Docker Hub rate limit fast.
          config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          
      # A version tag is immutable: if :<version> already exists and was built
      # from another commit, the chart was not bumped. If that commit changed
      # anything that goes into the image, fail instead of overwriting the
      # image a running release (and its rollback) points at. If it only
      # touched CI, docs, Markdown or the chart, reuse the existing image and
      # skip the build (the deploy then changes nothing unless the chart is
      # bumped). A re-run of the same commit may rebuild it.
      - name: Refuse to overwrite a version built from another commit
        id: guard
        if: steps.ver.outputs.version != ''
        run: |
          set -euo pipefail
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}"
          if ! JSON="$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/dev/null)"; then
            echo "$REF does not exist yet."
            exit 0
          fi
          REV="$(printf '%s' "$JSON" | jq -r '[.. | objects | .Labels? // empty | .["org.opencontainers.image.revision"]? // empty] | first // ""')"
          if [ -z "$REV" ] || [ "$REV" = "$GITHUB_SHA" ]; then
            echo "$REF exists from this commit (${REV:-unlabelled}); rebuilding it."
            exit 0
          fi
          CHANGED=""
          if git fetch -q --no-tags --depth=1 origin "$REV" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$REV" "$GITHUB_SHA" || echo '<diff failed>')"
          else
            CHANGED="<could not fetch $REV>"
          fi
          IMAGE_INPUTS="$(printf '%s\n' "$CHANGED" | grep -vE '^(\.github/|docs/|charts/)|\.md$|^$' || true)"
          if [ -z "$IMAGE_INPUTS" ]; then
            echo "::notice title=Image reused::$REF was built from ${REV::7}; this commit only changes CI/docs/chart files, so the image is reused and not rebuilt. Bump Chart.yaml version + appVersion to deploy a change."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Files changed since ${REV::7} that can affect the image:"
          printf '%s\n' "$IMAGE_INPUTS" | head -20
          echo "::error title=Image version already published::$REF was built from ${REV::7}, not ${GITHUB_SHA::7}. Bump Chart.yaml version + appVersion (next patch above main) so this commit gets its own immutable tag."
          exit 1

      - name: Extract metadata (tags, labels) for Docker
        if: steps.guard.outputs.skip_build != 'true'
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Same tags as the metadata-action defaults (branch / tag / pr-N),
          # plus :sha-<short> always, :<version> (default branch, resolved
          # above) and :latest ONLY for default-branch builds. :latest is a
          # convenience; charts should deploy :<version> (IfNotPresent). Older
          # charts still deploy latest + Always, so a PR build must never
          # overwrite :latest.
          flavor: |
            latest=false
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Debug image info
        if: steps.guard.outputs.skip_build != 'true'
        run: |
          echo "ImageName: ${{ env.IMAGE_NAME }}"
          echo "Docker tags: ${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        if: steps.guard.outputs.skip_build != 'true'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.GHCR_PAT }}
          secrets: |
            npmrc=${{ secrets.NPMRC }}

      - name: Summary
        run: |
          {
            echo "### ${{ env.IMAGE_NAME }}"
            echo "- version: \`${{ steps.ver.outputs.version || 'none' }}\`"
            echo "- sha tag: \`${{ steps.ver.outputs.sha_tag }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest || 'not rebuilt (existing image reused)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
