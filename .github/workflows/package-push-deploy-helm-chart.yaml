name: Package, Publish, and Deploy Helm Chart

on:
  workflow_call:
    inputs:
      namespace:
        description: 'The Kubernetes namespace to deploy to'
        required: true
        default: 'default'
        type: string
      values_file:
        description: 'Path to the values file'
        required: false
        default: ''
        type: string
      chart_path:
        description: 'Path to the Helm chart directory'
        required: true
        type: string
      release_name:
        description: 'Helm release name'
        required: true
        type: string
      runs_on:
        description: 'JSON-encoded runs-on value. Defaults to "burtson-labs-runners" (the Burtson-Labs self-hosted K3s pool) — every consumer gets free deploys instead of billing GitHub Actions minutes. Pass `"ubuntu-latest"` (with the literal quotes around the string inside the JSON) to opt back to github-hosted; required on the rare path where the cluster the workflow targets is unreachable from inside the K3s pool itself.'
        required: false
        type: string
        default: '"burtson-labs-runners"'
    secrets:
      HELM_REPO_USERNAME:
        description: 'Username for Helm repository'
        required: true
      HELM_REPO_PASSWORD:
        description: 'Password for Helm repository'
        required: true
      KUBECONFIG:
        description: 'Base64-encoded content of the kubeconfig file'
        required: true

jobs:
  package-publish-deploy:
    runs-on: ${{ fromJSON(inputs.runs_on) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install kubectl
        # GHA-hosted ubuntu images ship kubectl pre-installed; ARC self-hosted
        # runners do not. Install it here so the workflow runs on either pool.
        # Idempotent — re-installing on ubuntu-latest is harmless.
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  KARCH=amd64 ;;
            aarch64) KARCH=arm64 ;;
            arm64)   KARCH=arm64 ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          KVER="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KVER}/bin/linux/${KARCH}/kubectl"
          chmod +x /tmp/kubectl
          sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install ChartMuseum Plugin
        run: |
          helm plugin install https://github.com/chartmuseum/helm-push.git

      - name: Package Helm Chart
        run: |
          helm package ${{ inputs.chart_path }} --destination ./packaged

      # The Upload + Download pair was a leftover from when package and
      # publish were separate jobs. Both steps run on the same runner in
      # the same job today, so handing off via actions/{upload,download}-
      # artifact achieves nothing on disk — the packaged tgz is already
      # right where the next step expects it. Worse, every run consumed
      # GitHub artifact storage quota; once the org cap was hit, every
      # subsequent CI run failed with "Failed to CreateArtifact: Artifact
      # storage quota has been hit" (observed 2026-04-29 on AuthApi).
      # Drop both steps — saves the quota AND cuts ~10s of round-trip.
      # If publishing ever splits into a separate job again, swap the
      # artifact pair for a job-output-driven path.
      - name: Push Helm Chart
        # cm-push returns non-zero with "409 already exists" when the chart
        # version is unchanged from a previous publish (e.g. a PR run already
        # pushed it, then the merge re-fires and re-pushes the same version).
        # Treat that as a no-op and continue — the existing chart is still
        # valid for the helm upgrade step downstream.
        #
        # IMPORTANT: tolerating the 409 silently is what enables the deploy
        # to proceed, but it ALSO means a "forgot to bump Chart.yaml" deploy
        # can succeed visually while changing nothing on the cluster. The
        # Verify step below explicitly warns when that happens, so the
        # silent-no-op failure mode is at least loud in the workflow log.
        id: cm_push
        run: |
          helm repo add burtson-labs-charts https://charts.burtson.ai --username ${{ secrets.HELM_REPO_USERNAME }} --password ${{ secrets.HELM_REPO_PASSWORD }}
          set +e
          OUT="$(helm cm-push ./packaged/*.tgz burtson-labs-charts 2>&1)"
          EXIT=$?
          set -e
          echo "$OUT"
          SKIPPED=false
          if [ "$EXIT" -ne 0 ]; then
            if echo "$OUT" | grep -qE "409|already exists"; then
              echo "::warning ::Chart version already exists in ChartMuseum; skipping cm-push and continuing with the existing chart."
              SKIPPED=true
            else
              exit "$EXIT"
            fi
          fi
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

      - name: Verify chart version actually changed
        # If cm-push hit 409 (chart version unchanged) AND the chart's
        # deployment template has no `rollme` / Release.Revision annotation,
        # the downstream `helm upgrade` will see no diff and silently no-op.
        # Surface this as a loud workflow warning so the operator knows the
        # deploy succeeded but the cluster did NOT pick up new code.
        if: steps.cm_push.outputs.skipped == 'true'
        run: |
          CHART_VERSION="$(grep -E '^version:' ${{ inputs.chart_path }}/Chart.yaml | head -1 | awk '{print $2}')"
          echo "::warning title=Chart version collision::Chart ${{ inputs.release_name }} version $CHART_VERSION was already in ChartMuseum. The downstream helm upgrade will run, but if the deployment template has no version-aware annotation (rollme/Release.Revision), pods WILL NOT rotate and the cluster will keep running the old image. Bump Chart.yaml's version+appVersion before the next push to force a rollout."

      - name: Set up Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        shell: bash

      - name: Ensure kubectl can connect to the cluster
        run: |
          kubectl get nodes

      - name: Add Helm repository
        run: helm repo add burtson-labs-charts https://charts.burtson.ai --username ${{ secrets.HELM_REPO_USERNAME }} --password ${{ secrets.HELM_REPO_PASSWORD }}

      - name: Update Helm repository
        run: helm repo update

      - name: Deploy Helm chart
        run: |
          if [ -z "${{ inputs.values_file }}" ]; then
            helm upgrade --install ${{ inputs.release_name }} burtson-labs-charts/${{ inputs.release_name }} \
              --namespace ${{ inputs.namespace }}
          else
            helm upgrade --install ${{ inputs.release_name }} burtson-labs-charts/${{ inputs.release_name }} \
              --namespace ${{ inputs.namespace }} -f ${{ inputs.values_file }}
          fi